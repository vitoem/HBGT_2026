<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} · {{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">
</head>

<body class="{% if page.url contains '/dia-' %}day-page{% else %}home-page{% endif %}">
  <main class="wrapper">
    {{ content }}
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", function () {

      /*
       * Detecta nombres de archivos escritos entre backticks
       * y les aplica automáticamente la clase .file-ref.
       */

      const filePattern =
        /^(?:\.{0,2}\/)?[\w.@+-]+(?:\/[\w.@+-]+)*\.(?:slurm|sh|bash|py|pl|r|R|txt|csv|tsv|fa|fna|fasta|faa|fq|fastq|gz|bz2|xz|zip|tar|tgz|gff|gff3|gtf|bed|sam|bam|vcf|vcf\.gz|yml|yaml|json|xml|html|md|pdf|fas|clean|matrix)$/i;

      document.querySelectorAll(".day-page code").forEach(function (code) {

        // No modificar código que forma parte de un bloque de código.
        if (code.closest("pre")) {
          return;
        }

        // No modificar elementos que ya tengan una clase especial.
        if (code.classList.contains("language-") ||
            code.classList.contains("file-ref")) {
          return;
        }

        const text = code.textContent.trim();

        if (filePattern.test(text)) {
          code.classList.add("file-ref");
        }
      });
    });
  </script>

  <script>
document.addEventListener("DOMContentLoaded", function () {

  document.querySelectorAll(".day-page pre").forEach(function (pre) {

    // Evitar agregar el botón dos veces
    if (pre.querySelector(".copy-code-button")) {
      return;
    }

    const button = document.createElement("button");
    button.className = "copy-code-button";
    button.type = "button";
    button.textContent = "Copiar";

    button.addEventListener("click", async function () {

      const code = pre.querySelector("code");

      if (!code) {
        return;
      }

      try {
        await navigator.clipboard.writeText(code.textContent);

        button.textContent = "✓ Copiado";
        button.classList.add("copied");

        setTimeout(function () {
          button.textContent = "Copiar";
          button.classList.remove("copied");
        }, 1800);

      } catch (error) {
        button.textContent = "Error";
        
        setTimeout(function () {
          button.textContent = "Copiar";
        }, 1800);
      }
    });

    pre.appendChild(button);
  });

});
</script>
  
</body>
</html>
